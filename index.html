<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Scorecard — Hackathon 2026</title>
  <link rel="stylesheet" href="css/deck.css">
</head>
<body>

<!-- Icons. In slides.md, write :name: to use one, e.g. :sparkle: for <symbol id="i-sparkle">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-scorecard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4" width="15" height="17.5" rx="1.5"/><rect x="9" y="2" width="6" height="4" rx="1"/>
    <path d="M8 10.5h1M11 10.5h5M8 14h1M11 14h5M8 17.5h1M11 17.5h5"/>
  </symbol>
  <symbol id="i-high" viewBox="0 0 24 24">
    <path d="M12 2.5 23 21.5H1Z" fill="currentColor"/>
    <path d="M12 9v6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="18.3" r="1.3" fill="#fff"/>
  </symbol>
  <symbol id="i-medium" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="9.5"/><path d="M12 6.8v6.4" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-fixed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.5"/><path d="m7.5 12.3 3 3 6-6.3"/>
  </symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24" fill="currentColor">
    <path d="M10 3.5 11.6 8.4 16.5 10 11.6 11.6 10 16.5 8.4 11.6 3.5 10 8.4 8.4Z"/>
    <path d="M18 13.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9Z"/>
    <path d="M18 2.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7Z"/>
  </symbol>
  <symbol id="i-branding" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21a9 9 0 1 1 9-9c0 2.5-2 3.5-4 3.5h-2a2 2 0 0 0-1.4 3.4A1.3 1.3 0 0 1 12 21Z"/>
    <circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15.5" cy="7.5" r="1.2" fill="currentColor"/>
  </symbol>
  <symbol id="i-performance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="13.5" r="8"/><path d="M12 13.5V9M10 2.5h4M18.5 6.5l1.5-1.5"/>
  </symbol>
  <symbol id="i-maintenance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    <path d="M14.7 6.3a4 4 0 0 0-5.3 5.2L3.5 17.4l3.1 3.1 5.9-5.9a4 4 0 0 0 5.2-5.3l-2.6 2.6-2.3-.6-.6-2.3Z"/>
  </symbol>
  <symbol id="i-dismiss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M4 20 20 4"/>
  </symbol>
</svg>

<!--
  The slides are NOT in this file. Edit slides.md instead (see EDITING.md).
  data-edit-url is where the "Edit the slides" link (press ? or E) points.
-->
<main id="deck"
      data-source="slides.md"
      data-edit-url="https://github.com/MichaelKowal/hackathon-2026-webpage/edit/main/slides.md"></main>

<script src="js/slides-md.js"></script>
<script src="js/deck.js"></script>
</body>
</html>
